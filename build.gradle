plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id

def compatibilityRuntime = providers.gradleProperty('compatRuntime').getOrElse('none')
if (!(compatibilityRuntime in ['none', 'extendedae', 'advancedae', 'ae2cs', 'all'])) {
    throw new GradleException("Unknown compatRuntime: ${compatibilityRuntime}")
}
dependencyLocking {
    lockAllConfigurations()
    lockMode = LockMode.STRICT
    lockFile = file("gradle/locks/${compatibilityRuntime}.lockfile")
}

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    restartTest {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
    clientSmoke {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += output + compileClasspath + main.runtimeClasspath
    }
}

// Original optional jars are inspected as data only; never add them to the game runtime.
configurations {
    compatAuditOriginal {
        canBeConsumed = false
        transitive = false
    }
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--mixin', 'ae2_overclocked.mixins.json',
                    '--mixin', 'ae2_overclocked.extendedae.mixins.json',
                    '--mixin', 'ae2_overclocked.advancedae.mixins.json',
                    '--mixin', 'ae2_overclocked.ae2cs.mixins.json'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('clientInteractionSmoke')) {
                property 'ae2oc.clientInteractionSmoke', 'true'
            }
            if (project.hasProperty('clientSmoke') || project.hasProperty('clientInteractionSmoke')) {
                mods { "${mod_id}" { source sourceSets.clientSmoke } }
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
            if (project.hasProperty('restartPhase')) {
                if (!(compatibilityRuntime in ['ae2cs', 'all'])) {
                    throw new GradleException('Restart verification requires AE2CS')
                }
                workingDirectory project.file(providers.gradleProperty('restartDirectory').get())
                property 'ae2oc.restartPhase', providers.gradleProperty('restartPhase').get()
                mods { "${mod_id}" { source sourceSets.restartTest } }
            } else if (project.hasProperty('migrationPhase')) {
                workingDirectory project.file(providers.gradleProperty('migrationDirectory').get())
                property 'ae2oc.migrationPhase', providers.gradleProperty('migrationPhase').get()
                mods { "${mod_id}" { source sourceSets.restartTest } }
            } else if (project.hasProperty('benchmark')) {
                if (project.hasProperty('benchmarkDirectory')) {
                    workingDirectory project.file(providers.gradleProperty('benchmarkDirectory').get())
                }
                property 'ae2oc.benchmark', 'true'
            }
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you
    maven {
        url "https://www.cursemaven.com"
    }
}

dependencies {
    compatAuditOriginal "curse.maven:applied-energistics-2-223794:${ae2_file_id}"
    compatAuditOriginal "curse.maven:ex-pattern-provider-892005:${extendedae_file_id}"
    compatAuditOriginal "curse.maven:advancedae-1084104:${advancedae_file_id}"
    compatAuditOriginal "curse.maven:ae2addonlib-1366135:${ae2addonlib_file_id}"
    compatAuditOriginal "curse.maven:ae2-crystal-science-1435174:${ae2cs_file_id}"
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // AE2 (Applied Energistics 2) - 必选前置
    implementation fg.deobf("curse.maven:applied-energistics-2-223794:${ae2_file_id}")
    runtimeOnly fg.deobf("curse.maven:guideme-1173950:${guideme_file_id}")
    // ExtendedAE (Ex Pattern Provider) - 可选兼容
    compileOnly fg.deobf("curse.maven:ex-pattern-provider-892005:${extendedae_file_id}")
    // AdvancedAE - 可选兼容
    compileOnly fg.deobf("curse.maven:advancedae-1084104:${advancedae_file_id}")
    // AdvancedAE embeds ae2addonlib through JarJar; expose its matching API for typed adapters.
    compileOnly fg.deobf("curse.maven:ae2addonlib-1366135:${ae2addonlib_file_id}")
    compileOnly fg.deobf("curse.maven:ae2-crystal-science-1435174:${ae2cs_file_id}")
    if (providers.gradleProperty('compatRuntime').getOrElse('none') in ['ae2cs', 'all']) {
        runtimeOnly fg.deobf("curse.maven:ae2-crystal-science-1435174:${ae2cs_file_id}")
    }
    if (providers.gradleProperty('compatRuntime').getOrElse('none') in ['extendedae', 'all']) {
        runtimeOnly fg.deobf("curse.maven:ex-pattern-provider-892005:${extendedae_file_id}")
        runtimeOnly fg.deobf("curse.maven:glodium-957920:${glodium_file_id}")
    }
    if (providers.gradleProperty('compatRuntime').getOrElse('none') in ['advancedae', 'all']) {
        runtimeOnly fg.deobf("curse.maven:advancedae-1084104:${advancedae_file_id}")
        runtimeOnly fg.deobf("curse.maven:geckolib-388172:${geckolib_file_id}")
    }

    // Mixin annotation processor
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            ae2_version_range: ae2_version_range, extendedae_version_range: extendedae_version_range,
            advancedae_version_range: advancedae_version_range, ae2cs_version_range: ae2cs_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// ---------------------------------------------------------------------------
// Release artifact trimming
// ---------------------------------------------------------------------------
// GameTest holders and the recipe fixtures they drive stay in the main source set, because
// the develop-time game test server discovers them through the mod's own classpath. They are
// development scaffolding, not part of the shipped mod, so the published jar drops them.
//
// Everything under the package below is develop-time only. A class placed there by mistake
// would be silently trimmed, so verifyReleaseContents fails on any name it does not know.
def devOnlyPackages = ['moakiee/ae2oc/platform/forge/']
def devOnlyClasses = [
        'AE2CSGameTests',
        'AE2CSNaturalScheduling',
        'AE2CSEnergySemantics',
        'AE2CSPulverizerRecipes',
        'AE2CSAggregatorRecipes',
        'AE2CSCircuitEtcherRecipes',
        'AE2CSEntropyRecipes',
        'InscriberGameTests',
        'ExtendedInscriberRecipes',
        'GridMachineScheduling',
        'MachineProgressVerification',
        'MenuPacketProbe',
        'CutterGameTests',
        'ExtendedCutterRecipes',
        'ReactionChamberGameTests',
        'AdvancedReactionRecipes',
        'RefactorGameTests',
        'MachinePerformanceBenchmark',
]

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest {
        attributes([
                'Specification-Title'      : mod_id,
                'Specification-Vendor'     : mod_authors,
                'Specification-Version'    : '1',
                'Implementation-Title'     : project.name,
                'Implementation-Version'   : project.jar.archiveVersion,
                'Implementation-Vendor'    : mod_authors,
                'MixinConfigs'             : 'ae2_overclocked.mixins.json,ae2_overclocked.extendedae.mixins.json,ae2_overclocked.advancedae.mixins.json,ae2_overclocked.ae2cs.mixins.json'
        ])
    }

    devOnlyPackages.each { exclude it + '**' }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.register('coreContractTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'moakiee.ae2oc.core.CoreContractTest'
}
tasks.register('verifyArchitecture') {
    def sources = fileTree('src/main/java') { include '**/*.java' }
    inputs.files(sources)
    doLast {
        sources.each { source ->
            def text = source.getText('UTF-8')
            ['java.lang.reflect', 'sun.misc.Unsafe', '@Overwrite'].each { forbidden ->
                if (text.contains(forbidden)) throw new GradleException("Forbidden integration mechanism ${forbidden}: ${source}")
            }
            def path = source.path.replace('\\', '/')
            if (path.contains('/ae2oc/core/') || path.contains('/ae2oc/api/')) {
                if (text =~ /(?m)^import (?:static )?(appeng|net\.minecraft|net\.minecraftforge|io\.github|com\.glodblock|net\.pedroksl)\./) {
                    throw new GradleException("Domain code imports a platform or optional mod: ${source}")
                }
            }
        }
    }
}

tasks.register('verifyMixinTargets', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'moakiee.ae2oc.audit.MixinTargetAudit'
    inputs.files(sourceSets.main.output.classesDirs, sourceSets.main.compileClasspath, configurations.compatAuditOriginal)
    doFirst {
        def reportDir = layout.buildDirectory.dir('reports/mixin-targets').get().asFile
        reportDir.mkdirs()
        def mapped = new File(reportDir, 'mapped-jars.txt')
        def production = new File(reportDir, 'production-jars.txt')
        mapped.setText(sourceSets.main.compileClasspath.files.findAll { it.name.endsWith('.jar') }
                .sort { it.name }.collect { it.absolutePath }.join('\n'), 'UTF-8')
        production.setText(configurations.compatAuditOriginal.files.sort { it.name }
                .collect { it.absolutePath }.join('\n'), 'UTF-8')
        args = [layout.buildDirectory.dir('classes/java/main/moakiee/mixin').get().asFile.absolutePath,
                mapped.absolutePath, production.absolutePath]
    }
}
// Proves the published artifact carries no develop-time scaffolding. The other test source
// sets (clientSmoke, test) are separate source sets and therefore already absent, but they
// are asserted here too so the trimming policy stays explicit and regression-proof.
tasks.register('verifyReleaseContents') {
    dependsOn 'reobfJar'
    def archive = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def devOnlySources = fileTree('src/main/java/moakiee/ae2oc/platform/forge') { include '**/*.java' }
    inputs.file(archive)
    inputs.files(devOnlySources)
    doLast {
        def zip = new java.util.zip.ZipFile(archive.get().asFile)
        try {
            def entries = zip.entries().collect { it.name }
            devOnlyPackages.each { prefix ->
                def shipped = entries.findAll { it.startsWith(prefix) }
                if (shipped) {
                    throw new GradleException("Release jar ships develop-time scaffolding: ${shipped}")
                }
            }
            ['GameTests', 'GameTestServer', 'ClientSmoke', 'ContractTest', 'RestartVerification', 'MigrationVerification', 'PerformanceBenchmark'].each { needle ->
                def shipped = entries.findAll { it.contains(needle) }
                if (shipped) {
                    throw new GradleException("Release jar ships test scaffolding: ${shipped}")
                }
            }
            devOnlySources.each { source ->
                def name = source.name.replace('.java', '')
                if (!devOnlyClasses.contains(name)) {
                    throw new GradleException(
                            "${source} is inside a develop-only package but is not a known GameTest fixture; " +
                                    "move it out or add it to devOnlyClasses in build.gradle")
                }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('stageReleaseRuntimeMods') {
    def destination = providers.gradleProperty('releaseDirectory').map { file(it).toPath().resolve('mods').toFile() }
    inputs.files(configurations.named('__obfuscated'))
    outputs.dir(destination)
    doLast {
        if (!providers.gradleProperty('releaseDirectory').isPresent()) {
            throw new GradleException('stageReleaseRuntimeMods requires -PreleaseDirectory')
        }
        def selected = ['applied-energistics-2-223794', 'guideme-1173950'] as Set
        if (compatibilityRuntime in ['extendedae', 'all']) selected.addAll(['ex-pattern-provider-892005', 'glodium-957920'])
        if (compatibilityRuntime in ['advancedae', 'all']) selected.addAll(['advancedae-1084104', 'geckolib-388172'])
        if (compatibilityRuntime in ['ae2cs', 'all']) selected.add('ae2-crystal-science-1435174')
        def artifacts = configurations.__obfuscated.resolvedConfiguration.resolvedArtifacts
                .findAll { selected.contains(it.moduleVersion.id.name) }
        def missing = selected - artifacts.collect { it.moduleVersion.id.name }
        if (missing) throw new GradleException("Missing production runtime artifacts: ${missing}")
        copy {
            from artifacts.collect { it.file }
            into destination.get()
        }
        artifacts.sort { it.moduleVersion.id.name }.each {
            println "Staged production mod ${it.moduleVersion.id.group}:${it.moduleVersion.id.name}:${it.moduleVersion.id.version} -> ${it.file.name}"
        }
    }
}
tasks.named('check') { dependsOn 'coreContractTest', 'verifyArchitecture', 'verifyMixinTargets', 'verifyReleaseContents', 'restartTestClasses' }
if (project.hasProperty('clientSmoke') || project.hasProperty('clientInteractionSmoke')) {
    tasks.matching { it.name == 'runClient' }.configureEach { dependsOn 'clientSmokeClasses' }
}
if (project.hasProperty('restartPhase') || project.hasProperty('migrationPhase')) {
    tasks.matching { it.name == 'runServer' }.configureEach { dependsOn 'restartTestClasses' }
}
tasks.register('injectLegacyRegion', JavaExec) {
    dependsOn 'restartTestClasses'
    classpath = sourceSets.restartTest.runtimeClasspath
    mainClass = 'moakiee.ae2oc.WorldMigrationVerification'
    if (project.hasProperty('migrationDirectory')) {
        args providers.gradleProperty('migrationDirectory').get()
    }
}
