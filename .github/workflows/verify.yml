name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [none, extendedae, advancedae, ae2cs, all]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and server contracts
        shell: pwsh
        run: ./scripts/verify-compatibility.ps1 -Runtime '${{ matrix.runtime }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reports-${{ matrix.runtime }}
          path: |
            build/reports/
            run/crash-reports/
